name: Test page

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/test.yaml"
      - "src/**"
      - "public/**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install Dependencies
        run: |
          bun install

      - name: Build
        run: |
          bun run build

      - name: Test
        run: |
          bun run test
